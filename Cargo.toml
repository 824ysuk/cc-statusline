[package]
name = "statusline-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "statusline-rs"
path = "src/main.rs"
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "statusline_full"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
