name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify README statusLine format
        run: |
          json_blocks=$(awk '/^```json$/,/^```$/' README.md)
          if echo "$json_blocks" | grep -q '"hooks"' && \
             echo "$json_blocks" | grep -A5 '"hooks"' | grep -q '"StatusLine"'; then
            echo "ERROR: README の設定例に誤った hooks.StatusLine 形式が含まれています"
            exit 1
          fi
          echo "$json_blocks" | grep -q '"statusLine"' || \
            { echo "ERROR: README の設定例に statusLine キーがありません"; exit 1; }
          echo "OK: README の statusLine 設定例は正しい形式です"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

      - name: cargo bench --no-run (PR-B harness compile gate)
        run: cargo bench --no-run --locked
